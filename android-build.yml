name: Build APK

# Produces a directly installable APK for every push to the default branches, and attaches the
# APKs to a GitHub Release when a tag like v1.1.11 is pushed. Can also be started manually from
# the "Actions" tab (workflow_dispatch).
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'document/**'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor to build'
        type: choice
        options:
          - public
          - personal
        default: public

# Needed to attach APKs to a GitHub Release on tag builds.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLAVOR: ${{ github.event.inputs.flavor || 'public' }}

jobs:
  build:
    name: Assemble ${{ github.event.inputs.flavor || 'public' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 9 / Gradle 9.4 both run on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # compileSdk is 37; install it explicitly and stay tolerant if the runner image already
      # has it or if sdkmanager cannot reach the repository (AGP will then try its own download).
      - name: Install Android platform 37
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" "platform-tools" >/dev/null 2>&1 \
            || echo "::warning::Could not preinstall platforms;android-37 — AGP will attempt to download it."

      # The keystore is cached so that every CI build is signed with the same key: without a
      # stable signature Android refuses to install an update over a previously installed build.
      # Supply KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to use your
      # own key instead of the generated one.
      - name: Restore CI keystore
        uses: actions/cache@v4
        with:
          path: ci-keystore
          key: ci-keystore-${{ github.repository }}-v1
          restore-keys: |
            ci-keystore-${{ github.repository }}-

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ci-keystore
          KS="$PWD/ci-keystore/release.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PASS="${STORE_PASSWORD:-}"
            ALIAS="${KEY_ALIAS:-}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
            echo "Signing with the keystore provided by repository secrets."
          elif [ -f "$KS" ]; then
            STORE_PASS="${STORE_PASSWORD:-rikkahub-ci}"
            ALIAS="${KEY_ALIAS:-rikkahub}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
            echo "Reusing the cached CI keystore (stable signature across builds)."
          else
            STORE_PASS="rikkahub-ci"
            ALIAS="rikkahub"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v \
              -keystore "$KS" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=RikkaHub Jude CI, OU=CI, O=RikkaHub, C=CN" >/dev/null
            echo "Generated a fresh CI keystore (it will be cached for later runs)."
          fi

          {
            echo "RIKKA_STORE_FILE=$KS"
            echo "RIKKA_STORE_PASSWORD=$STORE_PASS"
            echo "RIKKA_KEY_ALIAS=$ALIAS"
            echo "RIKKA_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      # The google-services Gradle plugin fails the build when app/google-services.json is
      # missing, and RikkaHubApp resolves FirebaseRemoteConfig unconditionally at startup.
      # A structurally valid placeholder keeps the app launchable in CI builds; set the
      # GOOGLE_SERVICES_JSON secret to get real Analytics / Crashlytics / Remote Config.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using google-services.json from repository secrets."
          else
            cp .github/ci/google-services.placeholder.json app/google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set — building with a placeholder config. Firebase Analytics / Crashlytics / Remote Config will be inactive, everything else works."
          fi

      - name: Resolve Gradle variant names
        run: |
          set -euo pipefail
          CAP="$(printf '%s' "$FLAVOR" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          {
            echo "CAP=$CAP"
            echo "APK_DIR=app/build/outputs/apk/$FLAVOR"
          } >> "$GITHUB_ENV"
          echo "Flavor: $FLAVOR → assemble${CAP}Release"

      - name: Build release APK
        id: build_release
        continue-on-error: true
        env:
          # R8 on a project of this size needs more than the 4g declared in gradle.properties.
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          ./gradlew ":app:assemble${CAP}Release" \
            --init-script .github/ci/disable-crashlytics-upload.init.gradle.kts \
            --no-configuration-cache \
            --stacktrace

      # Only used when the minified release build fails (e.g. R8 or signing trouble): the debug
      # APK still gives you something installable to test with. It is taller + slower, and it
      # installs under <applicationId>.debug so it can live next to the release build.
      - name: Build debug APK (fallback)
        id: build_debug
        if: steps.build_release.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::warning::Release build failed — falling back to the debug variant."
          ./gradlew ":app:assemble${CAP}Debug" \
            --init-script .github/ci/disable-crashlytics-upload.init.gradle.kts \
            --no-configuration-cache \
            --stacktrace

      - name: Collect installable APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          SHA="$(git rev-parse --short HEAD)"
          [ -n "$VERSION" ] || VERSION="unknown"

          count=0
          for dir in "app/build/outputs/apk/$FLAVOR/release" "app/build/outputs/apk/$FLAVOR/debug"; do
            [ -d "$dir" ] || continue
            for apk in "$dir"/*.apk; do
              [ -f "$apk" ] || continue
              base="$(basename "$apk" .apk)"        # app-public-universal-release
              suffix="${base#app-}"                 # public-universal-release
              suffix="${suffix#$FLAVOR-}"           # universal-release
              cp "$apk" "out/RikkaHub-Jude-${VERSION}-${SHA}-${suffix}.apk"
              count=$((count + 1))
            done
          done

          if [ "$count" -eq 0 ]; then
            echo "::error::No APK was produced — check the Gradle output above."
            exit 1
          fi

          ( cd out && sha256sum ./*.apk > SHA256SUMS.txt )
          ls -lh out
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-jude-${{ env.FLAVOR }}-apk
          path: out/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      # Non-blocking: unit tests are useful signal, but they must never hold back the APK.
      - name: Run unit tests
        if: always() && steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew ":app:test${CAP}DebugUnitTest" \
            --no-configuration-cache \
            --stacktrace

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/*.apk out/SHA256SUMS.txt --clobber

      - name: Write summary
        if: always()
        run: |
          {
            echo "## RikkaHub Jude — $FLAVOR APK"
            echo
            if [ -d out ] && [ -n "$(ls -A out 2>/dev/null)" ]; then
              echo "| File | Size |"
              echo "| --- | --- |"
              for f in out/*.apk; do
                [ -f "$f" ] || continue
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
              echo
              echo "Install the **universal** APK unless you specifically want a single-ABI build."
              echo "Download it from the *Artifacts* section of this run, then \`adb install -r <file>.apk\`."
            else
              echo "No APK produced. See the failing step above."
            fi
            echo
            echo "Release build outcome: \`${{ steps.build_release.outcome }}\`"
            echo "Debug fallback outcome: \`${{ steps.build_debug.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
